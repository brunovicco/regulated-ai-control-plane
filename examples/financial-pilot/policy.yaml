# Individual proof-of-concept draft: self-reviewed, not independently approved or compliant.
schema_version: "1"
policy_set:
  id: "poc-financial"
  version: "1.0.0"
  jurisdiction: "BR"
  sector: "financial_services"
  status: "draft"
rules:
  - id: "poc.minimize_identifiers"
    version: "1.0.0"
    match:
      jurisdiction: "BR"
      sector: "financial_services"
      operation_kind: "external_inference"
      data_class_any: ["PERSONAL_DIRECT_IDENTIFIER", "BRAZIL_CPF", "BRAZIL_CNPJ"]
    decision: "ALLOW_WITH_TRANSFORMATION"
    obligations:
      - type: "TOKENIZE"
        target_class: "PERSONAL_DIRECT_IDENTIFIER"
        reason_code: "MINIMIZE_EXTERNAL_IDENTIFIER"
    control_objectives: ["POC.MINIMIZATION"]

  - id: "poc.no_external_secrets"
    version: "1.0.0"
    match:
      operation_kind: "external_inference"
      data_class_any: ["AUTHENTICATION_SECRET"]
    decision: "DENY"
    reason_code: "SECRET_EXTERNAL_TRANSFER_DENIED"
    control_objectives: ["POC.DATA_LEAK_PREVENTION"]

  - id: "poc.approve_high_impact"
    version: "1.0.0"
    match:
      tool_risk_class_any: ["high_impact_state_change"]
    decision: "REQUIRE_APPROVAL"
    obligations:
      - type: "REQUIRE_HUMAN_APPROVAL"
        target: "matched_tool"
        reason_code: "HIGH_IMPACT_STATE_CHANGE"
    control_objectives: ["POC.ACTION_AUTHORITY"]

  - id: "poc.openai_store_false"
    version: "1.0.0"
    match:
      operation_kind: "external_inference"
      provider: "openai"
      service: "responses_api"
    requires_capabilities:
      - key: "store_false"
        accepted_states: ["supported"]
        max_age_days: 30
    control_objectives: ["POC.PROVIDER_CONFIGURATION"]

  - id: "poc.bedrock_demonstrable_controls"
    version: "1.0.0"
    match:
      operation_kind: "external_inference"
      provider: "aws"
      service: "bedrock_runtime"
    requires_capabilities:
      - key: "iam_authorization"
        accepted_states: ["supported"]
        max_age_days: 30
    control_objectives: ["POC.PROVIDER_CONFIGURATION"]
