# Organization-owned draft: not approved, signed or installed by this repository.
schema_version: "1"
policy_set:
  id: "org-financial-pilot"
  version: "1.0.0"
  jurisdiction: "BR"
  sector: "financial_services"
  status: "draft"
rules:
  - id: "org.pilot.minimize_identifiers"
    version: "1.0.0"
    match:
      jurisdiction: "BR"
      sector: "financial_services"
      operation_kind: "external_inference"
      data_class_any: ["PERSONAL_DIRECT_IDENTIFIER", "BRAZIL_CPF", "BRAZIL_CNPJ"]
    decision: "ALLOW_WITH_TRANSFORMATION"
    obligations:
      - type: "TOKENIZE"
        target_class: "PERSONAL_DIRECT_IDENTIFIER"
        reason_code: "MINIMIZE_EXTERNAL_IDENTIFIER"
    control_objectives: ["ORG.PILOT.MINIMIZATION"]

  - id: "org.pilot.no_external_secrets"
    version: "1.0.0"
    match:
      operation_kind: "external_inference"
      data_class_any: ["AUTHENTICATION_SECRET"]
    decision: "DENY"
    reason_code: "SECRET_EXTERNAL_TRANSFER_DENIED"
    control_objectives: ["ORG.PILOT.DATA_LEAK_PREVENTION"]

  - id: "org.pilot.approve_high_impact"
    version: "1.0.0"
    match:
      tool_risk_class_any: ["high_impact_state_change"]
    decision: "REQUIRE_APPROVAL"
    obligations:
      - type: "REQUIRE_HUMAN_APPROVAL"
        target: "matched_tool"
        reason_code: "HIGH_IMPACT_STATE_CHANGE"
    control_objectives: ["ORG.PILOT.ACTION_AUTHORITY"]

  - id: "org.pilot.openai_retention"
    version: "1.0.0"
    match:
      operation_kind: "external_inference"
      provider: "openai"
      service: "responses_api"
    requires_capabilities:
      - key: "zero_data_retention"
        accepted_states: ["conditional", "supported"]
        required_condition_assertions:
          - "eligible_organization_required"
          - "endpoint_or_feature_must_be_zdr_eligible"
        max_age_days: 30
    control_objectives: ["ORG.PILOT.PROVIDER_CONFIGURATION"]

  - id: "org.pilot.bedrock_controls"
    version: "1.0.0"
    match:
      operation_kind: "external_inference"
      provider: "aws"
      service: "bedrock_runtime"
    requires_capabilities:
      - key: "iam_authorization"
        accepted_states: ["supported"]
        max_age_days: 30
      - key: "aws_privatelink"
        accepted_states: ["supported"]
        required_condition_assertions: ["supported_endpoint_and_region_required"]
        max_age_days: 30
      - key: "cloudtrail_api_activity"
        accepted_states: ["supported"]
        required_condition_assertions: ["event_configuration_depends_on_api_operation"]
        max_age_days: 30
    control_objectives: ["ORG.PILOT.PROVIDER_CONFIGURATION"]
