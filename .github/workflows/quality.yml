name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: regulaai_test
          # Ephemeral CI service only; no production credentials or persistent volume.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d regulaai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      REGULAAI_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/regulaai_test
      REGULAAI_REQUIRE_POSTGRES_TESTS: "1"
      PYTEST_ADDOPTS: --junitxml=/tmp/regulaai-pilot-pytest.xml

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Install dependencies, including observability tests
        run: uv sync --frozen --all-groups --extra observability

      - name: Project quality gate
        run: uv run python scripts/quality_gate.py

      - name: Summarize financial pilot evidence
        if: ${{ !cancelled() }}
        run: >-
          uv run python scripts/report_financial_pilot_ci.py
          --junit /tmp/regulaai-pilot-pytest.xml
          --source-revision "$GITHUB_SHA"
          > /tmp/regulaai-pilot-ci.json

      - name: Retain metadata-only pilot evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: financial-pilot-ci
          path: /tmp/regulaai-pilot-ci.json
          if-no-files-found: error
          retention-days: 14
