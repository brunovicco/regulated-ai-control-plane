apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../kubernetes
patches:
  - target:
      kind: Deployment
      name: regulaai-control-plane
    patch: |-
      - op: remove
        path: /spec/template/spec/securityContext/runAsUser
      - op: remove
        path: /spec/template/spec/securityContext/runAsGroup
      - op: remove
        path: /spec/template/spec/securityContext/fsGroup
      - op: remove
        path: /spec/template/spec/securityContext/fsGroupChangePolicy
  - target:
      kind: CronJob
      name: regulaai-runtime-trust-verifier
    patch: |-
      - op: remove
        path: /spec/jobTemplate/spec/template/spec/securityContext/runAsUser
      - op: remove
        path: /spec/jobTemplate/spec/template/spec/securityContext/runAsGroup
      - op: remove
        path: /spec/jobTemplate/spec/template/spec/securityContext/fsGroup
      - op: remove
        path: /spec/jobTemplate/spec/template/spec/securityContext/fsGroupChangePolicy
