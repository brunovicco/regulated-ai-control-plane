apiVersion: apps/v1
kind: Deployment
metadata:
  name: regulaai-control-plane
  labels:
    app.kubernetes.io/name: regulaai-control-plane
    app.kubernetes.io/part-of: regulaai
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: regulaai-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: regulaai-control-plane
        app.kubernetes.io/part-of: regulaai
    spec:
      serviceAccountName: regulaai-control-plane
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: example.invalid/regulated-ai-control-plane
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: REGULAAI_ENVIRONMENT
              value: production
            - name: REGULAAI_SERVICE_VERSION
              valueFrom:
                configMapKeyRef:
                  name: regulaai-deployment-metadata
                  key: service-version
            - name: REGULAAI_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: regulaai-database-runtime
                  key: url
            - name: REGULAAI_CONTROL_PACK_MANIFEST
              value: /etc/regulaai/control-pack/control-pack-manifest.yaml
            - name: REGULAAI_CONTROL_PACK_TRUST_STORE
              value: /etc/regulaai/trust/control-pack-signing-keys.yaml
            - name: REGULAAI_EXECUTION_MODE
              value: mock
            - name: REGULAAI_TOKENIZATION_KEY
              valueFrom:
                secretKeyRef:
                  name: regulaai-runtime-keys
                  key: tokenization-key
            - name: REGULAAI_OPERATOR_AUTHORITY_TRUST_STORE
              value: /etc/regulaai/operator-authority/operator-authority-keys.yaml
            - name: REGULAAI_API_AUTH_MODE
              value: oidc_jwt
            - name: REGULAAI_OIDC_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: regulaai-api-identity
                  key: issuer
            - name: REGULAAI_OIDC_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: regulaai-api-identity
                  key: audience
            - name: REGULAAI_OIDC_JWKS_PATH
              value: /etc/regulaai/api-identity/jwks.json
          volumeMounts:
            - name: control-pack
              mountPath: /etc/regulaai/control-pack
              readOnly: true
            - name: control-pack-trust
              mountPath: /etc/regulaai/trust
              readOnly: true
            - name: operator-authority-trust
              mountPath: /etc/regulaai/operator-authority
              readOnly: true
            - name: api-identity-trust
              mountPath: /etc/regulaai/api-identity
              readOnly: true
            - name: temporary
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 1
              memory: 512Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: control-pack
          persistentVolumeClaim:
            claimName: regulaai-control-pack
        - name: control-pack-trust
          configMap:
            name: regulaai-control-pack-trust
        - name: operator-authority-trust
          configMap:
            name: regulaai-operator-authority-trust
        - name: api-identity-trust
          configMap:
            name: regulaai-api-identity
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
      terminationGracePeriodSeconds: 30
